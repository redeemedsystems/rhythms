{{define "today_item"}}
<li class="habit-row today-item" id="habit-{{.ID}}" style="--habit-color: {{.Color}}">
    {{if .IsNumerical}}
        <span id="habit-{{.ID}}-value">
            <button
                class="numeric-value{{if .TodayCompleted}} numeric-value-complete{{end}}"
                hx-get="/habits/{{.ID}}/entries/{{.TodayDate}}?from=today"
                hx-target="#habit-{{.ID}}-value"
                hx-swap="innerHTML"
            >{{.TodayNumericValue}}{{if .Unit}} {{.Unit}}{{end}}</button>
        </span>
    {{else}}
        <button
            class="checkmark checkmark-{{.TodayValue}}"
            hx-post="/habits/{{.ID}}/entries/{{.TodayDate}}?from=today"
            hx-target="#habit-{{.ID}}"
            hx-swap="outerHTML swap:200ms"
            aria-label="Mark {{.Name}} done"
        >&#10003;</button>
    {{end}}

    <div class="habit-info">
        <a href="/habits/{{.ID}}" class="habit-name">{{.Name}}</a>
        {{if .Question}}<div class="habit-question">{{.Question}}</div>{{end}}
    </div>

    {{if .CurrentStreak}}<span class="streak-badge">&#128293; {{.CurrentStreak}}</span>{{end}}
</li>
{{end}}
