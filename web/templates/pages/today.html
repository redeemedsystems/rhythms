{{define "page_today"}}
<div class="page-header">
    <div>
        <h1>Today</h1>
        <p class="today-date">{{.Date}}</p>
    </div>
    <div class="page-actions">
        <a href="/dashboard" class="btn">Dashboard</a>
        <a href="/" class="btn">All habits</a>
    </div>
</div>

<div class="today-page">
    {{if not .Items}}
        <p class="today-empty">Nothing left for today &mdash; nice work.</p>
    {{else}}
        <ul class="habit-list">
            {{range .Items}}{{template "today_item" .}}{{end}}
        </ul>
    {{end}}
</div>
{{end}}
