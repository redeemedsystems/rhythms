{{define "page_habit_form"}}
<div class="page-header">
    <h1>{{if .IsEdit}}Edit Habit{{else}}New Habit{{end}}</h1>
</div>

{{if .Error}}<p class="form-error">{{.Error}}</p>{{end}}

<form
    method="post"
    action="{{if .IsEdit}}/habits/{{.Habit.ID}}{{else}}/habits{{end}}"
    hx-post="{{if .IsEdit}}/habits/{{.Habit.ID}}{{else}}/habits{{end}}"
    hx-target="this"
    hx-swap="outerHTML"
>
    <label>
        Name
        <input type="text" name="name" value="{{.Habit.Name}}" required autofocus>
    </label>

    <label>
        Question <span class="hint">(shown as the prompt, e.g. "Did you meditate today?")</span>
        <input type="text" name="question" value="{{.Habit.Question}}">
    </label>

    <label>
        Description
        <textarea name="description">{{.Habit.Description}}</textarea>
    </label>

    <fieldset class="color-picker">
        <legend>Color</legend>
        {{range $i, $hex := .Palette}}
            <label class="color-swatch" style="--swatch-color: {{$hex}}">
                <input type="radio" name="color" value="{{$i}}" {{if eq $i $.Habit.Color}}checked{{end}}>
            </label>
        {{end}}
    </fieldset>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">{{if .IsEdit}}Save{{else}}Create{{end}}</button>
        <a href="/" class="btn">Cancel</a>
    </div>
</form>
{{end}}
