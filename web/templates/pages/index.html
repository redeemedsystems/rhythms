{{define "page_index"}}
<div class="page-header">
    <h1>Rhythms</h1>
    <div class="page-actions">
        <a href="/today" class="btn">Today</a>
        <a href="/dashboard" class="btn">Dashboard</a>
        <a href="/habits/new" class="btn btn-primary">+ New Habit</a>
        {{if .ShowArchived}}
            <a href="/">Show active</a>
        {{else}}
            <a href="/?archived=1">Show archived</a>
        {{end}}
    </div>
</div>
<div id="habit-list">
    {{template "habit_list" .}}
</div>
{{end}}
